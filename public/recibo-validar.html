<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Validação de recibo — AMPLIGUARD</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e7efe9;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: #14261f;
      }
      main {
        width: min(440px, calc(100% - 28px));
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 16px 40px rgba(7, 31, 26, 0.16);
      }
      header {
        background: #0c3b2e;
        color: #fff;
        padding: 18px 18px 14px;
        border-bottom: 3px solid #c6a15b;
      }
      header strong {
        letter-spacing: 0.08em;
      }
      header p {
        margin: 6px 0 0;
        font-size: 13px;
        opacity: 0.85;
      }
      section {
        padding: 18px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      .ok { color: #157a45; }
      .wait { color: #8a5a12; }
      .bad { color: #9f1239; }
      dl {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 8px 10px;
        margin: 14px 0 0;
        font-size: 14px;
      }
      dt { color: #5c6d65; }
      dd { margin: 0; font-weight: 700; }
      p.note {
        font-size: 13px;
        line-height: 1.45;
        color: #3e524a;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <strong>AMPLIGUARD</strong>
        <p>Conferência de autenticidade do recibo</p>
      </header>
      <section id="box">
        <p class="note">Consultando o documento…</p>
      </section>
    </main>
    <script src="/vendor/supabase.umd.js"></script>
    <script>
      const supabaseUrl = "https://mgnfuwlbvwarmjtiwsdh.supabase.co";
      const supabaseKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbmZ1d2xidndhcm1qdGl3c2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNjA2OTAsImV4cCI6MjA4NTczNjY5MH0.uA4i_aGJCu1fSVMdANkmOPfuyDuInaaqeTzyXrEgPD4";

      function money(value) {
        return Number(value || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      }

      function render(data) {
        const box = document.getElementById("box");
        if (!data || data.autentico !== true) {
          const waiting = data && data.status === "AGUARDANDO PAGAMENTO";
          box.innerHTML = waiting
            ? `<h1 class="wait">DOCUMENTO NÃO DEFINITIVO</h1>
               <p class="note">Este QR Code existe, mas o pagamento ainda não gerou um recibo definitivo.</p>
               <dl>
                 <dt>Número</dt><dd>${data.numero || "—"}</dd>
                 <dt>Placa</dt><dd>${data.placa || "—"}</dd>
                 <dt>Data</dt><dd>${data.data || "—"}</dd>
                 <dt>Status</dt><dd>AGUARDANDO PAGAMENTO</dd>
               </dl>`
            : `<h1 class="bad">RECIBO NÃO ENCONTRADO</h1>
               <p class="note">Não há recibo AMPLIGUARD correspondente a este código. Confira se o documento foi emitido pelo sistema.</p>`;
          return;
        }
        box.innerHTML = `<h1 class="ok">RECIBO AUTÊNTICO</h1>
          <p class="note">Documento emitido pela AMPLIGUARD. A placa é exibida de forma parcial.</p>
          <dl>
            <dt>Número</dt><dd>${data.numero || "—"}</dd>
            <dt>Placa</dt><dd>${data.placa || "—"}</dd>
            <dt>Data</dt><dd>${data.data || "—"}</dd>
            <dt>Valor</dt><dd>${money(data.valor)}</dd>
            <dt>Status</dt><dd>PAGO</dd>
          </dl>`;
      }

      async function run() {
        const token = new URLSearchParams(location.search).get("t") || "";
        if (!token || token.length < 16) {
          render(null);
          return;
        }
        const create = window.supabase?.createClient;
        if (!create) {
          render(null);
          return;
        }
        try {
          const client = create(supabaseUrl, supabaseKey);
          const { data, error } = await client.rpc("validar_recibo_pagamento", { p_token: token });
          if (error) {
            render(null);
            return;
          }
          render(data);
        } catch {
          render(null);
        }
      }

      run();
    </script>
  </body>
</html>
