<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#002f24" />
  <title>AMPLIGUARD | Apresentação Institucional</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      background: #071c19;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 8px 54px;
    }
    #slide {
      max-width: 100%;
      max-height: calc(100dvh - 74px);
      object-fit: contain;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #071c19ee;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      padding: 9px 8px calc(9px + env(safe-area-inset-bottom));
    }
    button {
      border: 1px solid #679c8c;
      background: #103a30;
      color: white;
      border-radius: 24px;
      padding: 8px 15px;
      font-size: 14px;
      cursor: pointer;
    }
    #count {
      font-size: 13px;
      min-width: 36px;
      text-align: center;
    }
    #hint {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #08271edb;
      padding: 8px 12px;
      border-radius: 22px;
      font-size: 12px;
      pointer-events: none;
      text-align: center;
      max-width: calc(100vw - 24px);
    }
    button:focus-visible, #slide:focus-visible {
      outline: 3px solid #fff;
    }
  </style>
</head>
<body>
  <div id="hint">Toque na imagem para avançar • Música ao primeiro toque</div>
  <main>
    <img id="slide" alt="Página 1 da apresentação AMPLIGUARD" tabindex="0" src="/apresentacao/slides/01.jpg" />
  </main>
  <footer>
    <button id="prev" type="button" aria-label="Página anterior">‹ Voltar</button>
    <span id="count">1 / 6</span>
    <button id="music" type="button" aria-label="Ativar ou desativar música">♫ Música: ligada</button>
    <button id="next" type="button">Avançar ›</button>
  </footer>
  <script>
    const slides = [
      "/apresentacao/slides/01.jpg",
      "/apresentacao/slides/02.jpg",
      "/apresentacao/slides/03.png",
      "/apresentacao/slides/04.png",
      "/apresentacao/slides/05.png",
      "/apresentacao/slides/06.png"
    ];
    let idx = 0, ctx = null, muted = false, playing = false, notesTimer = null;
    const img = document.getElementById("slide");
    function render() {
      img.src = slides[idx];
      img.alt = "Página " + (idx + 1) + " da apresentação AMPLIGUARD";
      document.getElementById("count").textContent = (idx + 1) + " / " + slides.length;
      document.getElementById("next").textContent = idx === slides.length - 1 ? "Recomeçar ↻" : "Avançar ›";
    }
    function startMusic() {
      if (muted) return;
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      ctx.resume();
      if (playing) return;
      playing = true;
      let n = 0;
      const chords = [[196, 246.94, 293.66], [174.61, 220, 261.63], [164.81, 196, 246.94], [174.61, 220, 293.66]];
      function play() {
        if (!ctx || muted || ctx.state === "closed") return;
        let t = ctx.currentTime + 0.02;
        let c = chords[n++ % chords.length];
        c.forEach((f) => {
          let o = ctx.createOscillator(), g = ctx.createGain();
          o.type = "sine";
          o.frequency.value = f;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.018, t + 0.35);
          g.gain.setValueAtTime(0.018, t + 1.4);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 2.9);
          o.connect(g);
          g.connect(ctx.destination);
          o.start(t);
          o.stop(t + 3);
        });
      }
      play();
      notesTimer = setInterval(play, 2600);
    }
    function go(d) {
      startMusic();
      idx = (idx + d + slides.length) % slides.length;
      render();
    }
    img.addEventListener("click", () => go(1));
    img.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        go(1);
      }
    });
    document.getElementById("next").onclick = () => go(1);
    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("music").onclick = () => {
      muted = !muted;
      document.getElementById("music").textContent = muted ? "♫ Música: desligada" : "♫ Música: ligada";
      if (muted) {
        clearInterval(notesTimer);
        playing = false;
        if (ctx) ctx.suspend();
      } else startMusic();
    };
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") go(1);
      if (e.key === "ArrowLeft") go(-1);
    });
    render();
  </script>
</body>
</html>
