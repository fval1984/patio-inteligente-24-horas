<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#002f24" />
  <title>AMPLIGUARD | Apresentação Institucional</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      background: #071c19;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 8px 54px;
    }
    #slide {
      max-width: 100%;
      max-height: calc(100dvh - 74px);
      object-fit: contain;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #071c19ee;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      padding: 9px 8px calc(9px + env(safe-area-inset-bottom));
    }
    button {
      border: 1px solid #679c8c;
      background: #103a30;
      color: white;
      border-radius: 24px;
      padding: 8px 15px;
      font-size: 14px;
      cursor: pointer;
    }
    #count {
      font-size: 13px;
      min-width: 36px;
      text-align: center;
    }
    #hint {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #08271edb;
      padding: 8px 12px;
      border-radius: 22px;
      font-size: 12px;
      pointer-events: none;
      text-align: center;
      max-width: calc(100vw - 148px);
    }
    #soundDock {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      right: calc(10px + env(safe-area-inset-right));
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #08271edb;
      border-radius: 22px;
      padding: 4px 8px 4px 4px;
    }
    #soundBtn {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      font-size: 16px;
      line-height: 1;
    }
    #soundLevel {
      width: 76px;
      height: 18px;
      margin: 0;
      accent-color: #ffffff;
    }
    button:focus-visible, #slide:focus-visible {
      outline: 3px solid #fff;
    }
  </style>
</head>
<body>
  <div id="hint">Toque na imagem para avançar • Música ao primeiro toque</div>
  <div id="soundDock">
    <button id="soundBtn" type="button" aria-pressed="false" aria-label="Silenciar música">🔊</button>
    <input id="soundLevel" type="range" min="0" max="100" value="100" aria-label="Volume da música" />
  </div>
  <main>
    <img id="slide" alt="Página 1 da apresentação AMPLIGUARD" tabindex="0" src="/apresentacao/slides/01.jpg" />
  </main>
  <footer>
    <button id="prev" type="button" aria-label="Página anterior">‹ Voltar</button>
    <span id="count">1 / 6</span>
    <button id="music" type="button" aria-label="Ativar ou desativar música">♫ Música: ligada</button>
    <button id="next" type="button">Avançar ›</button>
  </footer>
  <script>
    const slides = [
      "/apresentacao/slides/01.jpg",
      "/apresentacao/slides/02.jpg",
      "/apresentacao/slides/03.png",
      "/apresentacao/slides/04.png",
      "/apresentacao/slides/05.png",
      "/apresentacao/slides/06.png"
    ];
    let idx = 0, muted = false, started = false;
    let volume = 1;
    const TRACKS = ["/apresentacao/trilha.mp3", "/apresentacao/trilha.m4a", "/apresentacao/trilha.ogg", "/apresentacao/trilha.wav"];
    let trackIndex = 0;
    const audio = new Audio();
    audio.loop = true;
    audio.preload = "auto";
    audio.volume = 1;
    audio.setAttribute("playsinline", "");
    audio.src = TRACKS[0];
    audio.addEventListener("error", () => {
      trackIndex += 1;
      if (trackIndex < TRACKS.length) audio.src = TRACKS[trackIndex];
    });
    const img = document.getElementById("slide");
    function render() {
      img.src = slides[idx];
      img.alt = "Página " + (idx + 1) + " da apresentação AMPLIGUARD";
      document.getElementById("count").textContent = (idx + 1) + " / " + slides.length;
      document.getElementById("next").textContent = idx === slides.length - 1 ? "Recomeçar ↻" : "Avançar ›";
    }
    function applyVolume() {
      audio.volume = muted || volume <= 0 ? 0 : volume;
    }
    function syncSoundUi() {
      const silent = muted || volume <= 0;
      document.getElementById("music").textContent = silent ? "♫ Música: desligada" : "♫ Música: ligada";
      const soundBtn = document.getElementById("soundBtn");
      soundBtn.textContent = silent ? "🔇" : "🔊";
      soundBtn.setAttribute("aria-pressed", silent ? "true" : "false");
      soundBtn.setAttribute("aria-label", silent ? "Ativar música" : "Silenciar música");
    }
    function startMusic() {
      if (muted || volume <= 0) return;
      applyVolume();
      if (started && !audio.paused) return;
      const pending = audio.play();
      if (pending && typeof pending.then === "function") {
        pending.then(() => { started = true; }).catch(() => {});
      } else {
        started = true;
      }
    }
    function toggleMute() {
      muted = !muted;
      if (!muted && volume <= 0) {
        volume = 1;
        document.getElementById("soundLevel").value = "100";
      }
      syncSoundUi();
      applyVolume();
      if (!muted) startMusic();
    }
    function go(d) {
      startMusic();
      idx = (idx + d + slides.length) % slides.length;
      render();
    }
    img.addEventListener("click", () => go(1));
    img.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        go(1);
      }
    });
    document.getElementById("next").onclick = () => go(1);
    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("music").onclick = () => toggleMute();
    document.getElementById("soundBtn").onclick = () => toggleMute();
    document.getElementById("soundLevel").addEventListener("input", (event) => {
      volume = Math.max(0, Math.min(1, Number(event.target.value) / 100));
      muted = volume <= 0;
      syncSoundUi();
      applyVolume();
      if (!muted) startMusic();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") go(1);
      if (e.key === "ArrowLeft") go(-1);
    });
    render();
  </script>
</body>
</html>
